# ============================================================
# NGINX - FRONTEND BIBLIOTECA
# ============================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Publica la interfaz estática.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El frontend usa este endpoint para mostrar si el Gateway está UP.
    location = /gateway-health {
        proxy_pass http://api-gateway:9000/actuator/health;
        proxy_set_header Host $host;
    }

    # Las llamadas /api/... se envían al API Gateway.
    location /api/ {
        proxy_pass http://api-gateway:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
