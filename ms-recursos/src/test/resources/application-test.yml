# ============================================================
# MS-RECURSOS - Perfil de pruebas (mvn test)
# ============================================================
# Base H2 en memoria, sin Eureka ni PostgreSQL, para que las
# pruebas corran igual en local y en GitHub Actions.
# ============================================================

spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:recursos;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    database: h2
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  cloud:
    discovery:
      enabled: false

# Eureka desactivado en pruebas
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

# Clave JWT exclusiva para pruebas (no se usa en ningún entorno real)
jwt:
  secret: "Y2xhdmVQcnVlYmFzVW5pdGFyaWFzQmlibGlvdGVjYURldk9wczIwMjZTb2xvVGVzdHM="
