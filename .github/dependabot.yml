# ============================================================
# DEPENDABOT - Escaneo de dependencias
# ============================================================
# Revisión semanal de dependencias Maven, imágenes Docker y
# acciones de GitHub. Los PR van a dev y pasan por el pipeline.
# ============================================================
version: 2
updates:

  # Dependencias Maven (pom.xml padre y módulos)
  - package-ecosystem: maven
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, maven]
    commit-message:
      prefix: "chore(deps)"
    # Solo versiones menores y parches (los saltos mayores se revisan a mano)
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Imágenes base de Dockerfile y Dockerfile.frontend
  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    labels: [dependencies, docker]
    commit-message:
      prefix: "chore(docker)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Acciones usadas en los workflows
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    labels: [dependencies, ci]
    commit-message:
      prefix: "ci(deps)"
